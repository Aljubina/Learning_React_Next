<html>
    <body>
        <div id="app"></div>

        <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        
        <!-- Babel Script  : Javascript Compiler that compiles JSX (syntax extention of Javascript) that allow u to deascribe UI in familiar HTML like syntax -->
        <!-- Babel transform JSX code in regular Javascrpt cus browser doesnt understand JSX  -->
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        
        <script type = "text/jsx">
            
            const app = document.getElementById('app');

            /* function createTitle(title) {
                if(title) {
                    return title;
                } else {
                    return 'Default Title';
                }
            } */

            function Header({title}) {
                console.log(title);
                return (
                    <div>
                        <h1>{title ? title : 'Defualtty Title'}</h1>
                    </div>
                )
            };

            function Article() {
                return <p> Mental Disorders are crossing line in Youths...</p>;
            };

            function Footer() {
                return <p> Copyright &copy; 2023 My Health App </p>;
            }

            function Homepage() {
                const names = ['Ariel', 'Kimi', 'Max'];

                const [likes, setLikes] = React.useState(0);

                function handleClick() {
                    setLikes(likes+1);
                }

                return (
                    <div>
                        <Header title = "My Mental Health App"/>

                        <ul>
                            {names.map( (name) => (
                                <li key={name}>{name}</li>
                            ))}
                        </ul>
                    
                        <button onClick={handleClick}>Like {likes} </button>
                        <Article />
                      <Footer />
                    </div>
                );
            }

            const root = ReactDOM.createRoot(app);
            root.render(<Homepage/>);
            
        </script>
    </body>
</html>

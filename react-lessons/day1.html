<html>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Script  : Javascript Compiler that compiles JSX (syntax extention of Javascript) that allow u to deascribe UI in familiar HTML like syntax -->
    <!-- Babel transform JSX code in regular Javascrpt cus browser doesnt understand JSX  -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/jsx">
      const domNode = document.getElementById('app');
      const root = ReactDOM.createRoot(domNode);
      root.render(<h1>My App</h1>);
    </script>
  </body>
</html>
